name: Generar animacion de la serpiente

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AnaLizca07
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#FF8DC7

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
